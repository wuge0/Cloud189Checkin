name: Cloud check in action
on:
  push:
    branches:
      - main
  watch:
    types: started
  workflow_dispatch:
  schedule:
    - cron: 35 2 * * *

# Keep Running 步骤需要往仓库 push 空提交，沿用 checkout 持久化的凭据即可，
# 不再把 github.token 拼进 remote URL。
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: user
    timeout-minutes: 90
    steps:
      - name: 🔀 random delay 0-300 seconds
        run: sleep $((RANDOM % 301))

      - name: 🔌 Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🔨 Setup Node.js environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18
          cache: npm

      - name: 👾 Check if Debug is true
        if: vars.debug == '1'
        run: |
          echo "CLOUD189_VERBOSE=1" >> $GITHUB_ENV

      - name: 📹 Restore cached Cookie
        id: cache-cookie-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .token
          key: cloud189-token-${{ hashFiles('.token/*.json') }}
          restore-keys: cloud189-token-

      # 只注入签到真正需要的凭据（本仓库仅有 TY_ACCOUNTS 一项），
      # 不再用 toJSON(secrets) 把全部 secret 倒进 .env。
      # accounts.js 直接 JSON.parse(process.env.TY_ACCOUNTS)，所以走 GITHUB_ENV，
      # 避免 .env 的引号转义把 JSON 弄坏（dotenv 不会还原 \" 转义）。
      - name: 🔧 Init secrets
        env:
          TY_ACCOUNTS: ${{ secrets.TY_ACCOUNTS }}
        run: |
          if [ -z "$TY_ACCOUNTS" ]; then
            echo "::error::缺少 TY_ACCOUNTS（Settings → Secrets → Actions）"
            exit 1
          fi
          {
            echo "TY_ACCOUNTS<<__TY_ACCOUNTS_EOF__"
            printf '%s\n' "$TY_ACCOUNTS"
            echo "__TY_ACCOUNTS_EOF__"
          } >> "$GITHUB_ENV"

      - name: 📡 Init dependencies
        run: npm install

      - name: ✅ Validate accounts
        run: |
          node -e "
          require('dotenv').config();
          const accounts = require('./accounts');
          if (!accounts || accounts.length === 0) {
            console.error('ERROR: No accounts configured. Please set TY_ACCOUNTS or TY_USERNAME_1/TY_PASSWORD_1 in GitHub Secrets.');
            process.exit(1);
          }
          const valid = accounts.filter(a => {
            const u = a.username || a.userName;
            const p = a.password;
            return u && p && u !== 'userName' && p !== 'password';
          });
          if (valid.length === 0) {
            console.error('ERROR: All accounts have placeholder credentials. Please update GitHub Secrets with real username/password.');
            process.exit(1);
          }
          console.log('Found ' + valid.length + ' valid account(s)');
          "

      # 原本用 nick-fields/retry@master 做重试，改成脚本内重试，
      # 少一个第三方 action，行为保持一致（最多 3 次）。
      - name: 🚀 Run
        timeout-minutes: 60
        run: |
          for attempt in 1 2 3; do
            echo "::group::第 ${attempt} 次执行"
            if npm start; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::第 ${attempt} 次执行失败"
            sleep 15
          done
          echo "::error::签到连续 3 次失败"
          exit 1

      - name: 🔑 Compute token hash
        if: always()
        run: |
          NEW_HASH=$(find .token -name '*.json' -exec sha256sum {} \; 2>/dev/null | sha256sum | cut -d' ' -f1)
          echo "TOKEN_HASH=${NEW_HASH}" >> $GITHUB_ENV

      - name: 📹 Save cached Cookie
        if: always() && env.TOKEN_HASH != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .token
          key: cloud189-token-${{ env.TOKEN_HASH }}

      - name: 🚗 Keep Running
        if: github.event_name == 'schedule'
        run: |
          git config user.name "41898282+github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git commit --allow-empty -m "Keep Running..."
          git push
